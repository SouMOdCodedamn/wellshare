# Builds the WellShare APK.
#  - Publishing a GitHub Release (tag like v1.0.0) attaches the APK to that release.
#  - "Run workflow" on the Actions tab builds a test APK you can download from the run page.
name: Android app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check server settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_KEY in Settings > Secrets and variables > Actions, then run this again."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK uses a temporary key. Students will have to uninstall before installing the next version. See README > 'Permanent signing key'."
          fi

      - name: Work out version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.${{ github.run_number }}-test"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/WellShare-${{ steps.ver.outputs.name }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WellShare-${{ steps.ver.outputs.name }}
          path: out/*.apk

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

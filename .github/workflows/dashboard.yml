# Publishes the mentor dashboard to GitHub Pages (https://<you>.github.io/<repo>/).
# Turn on Pages first: Settings > Pages > Source: "GitHub Actions".
name: Mentor dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml", "security/scan_secrets.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get the sign-in library from npm (npm checks its integrity)
        run: |
          mkdir -p "$RUNNER_TEMP/sb" && cd "$RUNNER_TEMP/sb"
          npm pack @supabase/supabase-js@2.117.2 --silent
          tar xzf supabase-supabase-js-2.117.2.tgz

      - name: Build page (settings, security policy, library)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 dashboard/build.py --out _site --vendor "$RUNNER_TEMP/sb/package/dist/umd/supabase.js"

      - name: No secrets in the published site
        run: python3 security/scan_secrets.py --dir _site --built

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

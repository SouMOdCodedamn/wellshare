# Builds the WellShare APK.
#  - Publishing a GitHub Release (tag like v1.0.0) attaches the APK to that release.
#  - "Run workflow" on the Actions tab builds a test APK you can download from the run page.
#
# Uses the Android SDK and Java that GitHub's Ubuntu runners already have installed,
# so no extra setup actions are needed.
name: Android app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check server settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_KEY in Settings > Secrets and variables > Actions, then run this again."
            exit 1
          fi

      - name: Set up Java 17 and the Android SDK
        run: |
          JDK="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          echo "JAVA_HOME=$JDK" >> "$GITHUB_ENV"
          echo "$JDK/bin" >> "$GITHUB_PATH"
          "$JDK/bin/java" -version

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::This runner has no Android SDK (ANDROID_HOME is empty)."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Android platforms installed: $(ls "$SDK/platforms" | tr '\n' ' ')"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            echo "Installing Android 35 platform and build tools..."
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;34.0.0" > /dev/null
          fi

      - name: Download Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK uses a temporary key. Students will have to uninstall before installing the next version. See README > 'Permanent signing key'."
          fi

      - name: Work out version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.${{ github.run_number }}-test"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Show the important lines as an error on the run page.
            MSG=$(grep -E "^e: |error:|What went wrong|^> |FAILURE|Exception" "$RUNNER_TEMP/build.log" | head -n 40)
            [ -z "$MSG" ] && MSG=$(tail -n 40 "$RUNNER_TEMP/build.log")
            MSG="${MSG//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/}"
            echo "::error title=Build failed::$MSG"
            exit 1
          fi

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/WellShare-${{ steps.ver.outputs.name }}.apk"
          ls -la out

      - name: Security checks on the APK
        run: bash security/check_apk.sh "out/WellShare-${{ steps.ver.outputs.name }}.apk"

      - name: Checksum (lets anyone confirm the download wasn't altered)
        working-directory: out
        run: |
          sha256sum "WellShare-${{ steps.ver.outputs.name }}.apk" > "WellShare-${{ steps.ver.outputs.name }}.apk.sha256"
          cat ./*.sha256
          echo "### SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat ./*.sha256 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the R8 mapping (turns obfuscated crash reports back into readable ones)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-mapping-${{ steps.ver.outputs.name }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WellShare-${{ steps.ver.outputs.name }}
          path: |
            out/*.apk
            out/*.sha256

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            out/*.apk
            out/*.sha256
